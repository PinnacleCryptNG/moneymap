# Render's free plan sleeps after 15 idle minutes, so the first visitor waits 30–60 s.
# A light health check every 10 minutes keeps the demo awake. Remove this on a paid, always-on plan.
# (GitHub may delay scheduled runs at busy times, and pauses them after 60 days without repository activity.)
name: Keep demo awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the health check
        run: curl -fsS --max-time 90 --retry 2 https://moneymap-kuld.onrender.com/api/v1/health -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n"
