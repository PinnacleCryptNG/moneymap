# Render Blueprint — deploys MoneyMap (API + app) from the Dockerfile.
# In Render: New → Blueprint → pick this repo and branch.
services:
  - type: web
    name: moneymap
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: MONEYMAP_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      # Hackathon demo: Demo Mode stays on. A bank deployment sets MONEYMAP_MODE=production (see docs/SECURITY.md).
      - key: MONEYMAP_MODE
        value: demo
      # Render terminates TLS in front of the app; trust its X-Forwarded-For for per-client rate limits.
      - key: MONEYMAP_TRUST_PROXY
        value: "1"
